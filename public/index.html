<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Smart Queue — Login</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body data-page="index">
    <main class="container center">
      <div class="card auth-card">
        <div class="brand">
          <div class="logo">SQ</div>
          <div>
            <h1>Smart Queue</h1>
            <p class="muted">Appointment & Queue Management</p>
          </div>
        </div>

        <div class="tabs">
          <button id="tab-login" class="tab active">Login</button>
          <button id="tab-register" class="tab">Register</button>
        </div>

        <div id="login-form" class="form">
          <label>Email</label>
          <input id="login-email" type="email" placeholder="you@example.com" />
          <label>Password</label>
          <input id="login-pass" type="password" placeholder="password" />
          <div class="row">
            <button id="btn-login" class="btn">Login</button>
            <button id="guest-btn" class="btn ghost">Continue as Guest</button>
          </div>
          <!-- <p class="muted small">
            Demo accounts: demo@user.com / demo · admin@clinic.com / admin
          </p> -->
        </div>

        <div id="register-form" class="form hidden">
          <label>Full name</label>
          <input id="reg-name" placeholder="Your full name" />
          <label>Email</label>
          <input id="reg-email" type="email" />
          <label>Password</label>
          <input id="reg-pass" type="password" />
          <div class="row">
            <button id="btn-register" class="btn gold">Register</button>
            <button id="btn-cancel" class="btn ghost">Cancel</button>
          </div>
        </div>
      </div>
    </main>

    <!-- SOCKET.IO client script -->
    <script src="/socket.io/socket.io.js"></script>

    <!-- Your frontend socket logic -->
    <script src="/js/socket.js"></script>

    <!-- API scripts -->
    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/app.js"></script>
    
  </body>
</html>
